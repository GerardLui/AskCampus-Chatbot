<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AskCampus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F1E7;
    --paper-raised:#FFFDF8;
    --ink:#1F2A38;
    --ink-soft:#5B6472;
    --maroon:#7A2E2E;
    --maroon-deep:#5E2222;
    --gold:#C9A227;
    --line:#E4DCC9;
    --bubble-bot:#FFFDF8;
    --bubble-user:#7A2E2E;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  header{
    padding:22px 28px 18px;
    border-bottom:2px solid var(--maroon);
    background:var(--paper);
    flex-shrink:0;
  }
  .wordmark{
    font-family:'Lora',serif;
    font-weight:600;
    font-size:26px;
    color:var(--maroon-deep);
    letter-spacing:0.2px;
    margin:0;
  }
  .wordmark span{ color:var(--gold); }
  .tagline{
    margin:4px 0 0;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  main{
    flex:1;
    overflow-y:auto;
    padding:24px 0 12px;
  }
  .chat-col{
    max-width:680px;
    margin:0 auto;
    padding:0 20px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .row{
    display:flex;
    flex-direction:column;
    max-width:78%;
  }
  .row.bot{ align-self:flex-start; align-items:flex-start; }
  .row.user{ align-self:flex-end; align-items:flex-end; }
  .bubble{
    padding:12px 16px;
    border-radius:4px;
    font-size:15px;
    line-height:1.5;
  }
  .row.bot .bubble{
    background:var(--bubble-bot);
    border:1px solid var(--line);
    border-top-left-radius:2px;
    color:var(--ink);
  }
  .row.user .bubble{
    background:var(--bubble-user);
    color:#FBF6EC;
    border-top-right-radius:2px;
  }
  .meta{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:5px;
    padding:0 2px;
  }
  .meta .intent-tag{
    font-weight:600;
    color:var(--maroon-deep);
  }
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    max-width:680px;
    margin:0 auto 4px;
    padding:0 20px;
  }
  .chip{
    border:1px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink);
    padding:7px 13px;
    border-radius:999px;
    font-size:13px;
    cursor:pointer;
    transition:border-color .15s, transform .1s;
  }
  .chip:hover{ border-color:var(--maroon); }
  .chip:active{ transform:scale(0.97); }
  footer{
    flex-shrink:0;
    border-top:1px solid var(--line);
    background:var(--paper);
    padding:14px 20px 18px;
  }
  .input-col{
    max-width:680px;
    margin:0 auto;
    display:flex;
    gap:10px;
    align-items:flex-end;
  }
  #userInput{
    flex:1;
    resize:none;
    border:1px solid var(--line);
    background:var(--paper-raised);
    border-radius:10px;
    padding:11px 14px;
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--ink);
    max-height:120px;
    line-height:1.4;
  }
  #userInput:focus{
    outline:none;
    border-color:var(--maroon);
  }
  #sendBtn{
    background:var(--maroon);
    color:#FBF6EC;
    border:none;
    border-radius:10px;
    padding:11px 20px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:background .15s;
  }
  #sendBtn:hover{ background:var(--maroon-deep); }
  #sendBtn:disabled{ opacity:0.5; cursor:default; }
  .footnote{
    max-width:680px;
    margin:9px auto 0;
    padding:0 20px;
    font-size:11px;
    color:var(--ink-soft);
  }
  .typing{
    display:inline-flex;
    gap:4px;
    padding:4px 2px;
  }
  .typing span{
    width:6px; height:6px; border-radius:50%;
    background:var(--ink-soft);
    animation:blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay:.15s; }
  .typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes blink{
    0%,80%,100%{ opacity:.25; }
    40%{ opacity:1; }
  }
  main::-webkit-scrollbar{ width:8px; }
  main::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
</style>
</head>
<body>

<header>
  <p class="wordmark">Ask<span>Campus</span></p>
  <p class="tagline">Student information assistant &mdash; courses, fees, library, hostel, admissions &amp; more</p>
</header>

<main id="chatMain">
  <div class="chat-col" id="chatCol"></div>
</main>

<div class="chips" id="chips"></div>

<footer>
  <div class="input-col">
    <textarea id="userInput" rows="1" placeholder="Ask about fees, courses, library, admission..."></textarea>
    <button id="sendBtn">Send</button>
  </div>
  <p class="footnote">Runs a TF-IDF + Logistic Regression classifier trained on 408 sample queries across 38 intents &mdash; entirely in your browser.</p>
</footer>

<script>
const MODEL = JSON.parse(document.getElementById('model-data').textContent);
const RESPONSE_BANK = JSON.parse(document.getElementById('response-data').textContent);

const FALLBACK_RESPONSE = "I'm not confident I understood that. Could you rephrase, or ask about courses, fees, admission, library, hostel, or scholarships?";
const CONFIDENCE_THRESHOLD = 0.15;

function lemmatize(word){
  if(word.length > 4 && word.endsWith('ies')) return word.slice(0,-3)+'y';
  if(word.length > 4 && /(s|x|z|ch|sh)es$/.test(word)) return word.slice(0,-2);
  if(word.length > 3 && word.endsWith('s') && !word.endsWith('ss')) return word.slice(0,-1);
  return word;
}

function tokenize(text){
  const cleaned = text.toLowerCase().replace(/[^a-z\s]/g, ' ');
  const raw = cleaned.split(/\s+/).filter(t => t.length >= 2);
  return raw.map(lemmatize);
}

function buildNgrams(tokens){
  const grams = [...tokens];
  for(let i=0; i<tokens.length-1; i++){
    grams.push(tokens[i] + ' ' + tokens[i+1]);
  }
  return grams;
}

// Response text in intents.json sometimes carries raw <a href="..."> markup
// meant for a page that renders HTML. This chat renders plain text (safer,
// no injection risk from data), so turn "<a href='X'>label</a>" into a
// readable "label (X)" instead of showing literal angle brackets.
function toPlainText(text){
  return text.replace(/<a[^>]*href=["']([^"']*)["'][^>]*>(.*?)<\/a>/gi, (_, href, label) => {
    const cleanLabel = label.trim() || 'here';
    return href && href.toLowerCase() !== 'link' && !href.startsWith('ADD')
      ? `${cleanLabel} (${href})`
      : cleanLabel;
  });
}

function pickResponse(intent){
  const options = RESPONSE_BANK[intent];
  if(!options || options.length === 0) return FALLBACK_RESPONSE;
  const raw = options[Math.floor(Math.random() * options.length)];
  return toPlainText(raw);
}

function classify(text){
  const tokens = tokenize(text);
  const grams = buildNgrams(tokens);

  const counts = {};
  for(const g of grams){
    if(g in MODEL.vocabulary){
      counts[g] = (counts[g] || 0) + 1;
    }
  }

  const entries = Object.entries(counts);
  if(entries.length === 0){
    return { intent: null, confidence: 0 };
  }

  // tf-idf
  const tfidf = entries.map(([term, tf]) => {
    const idx = MODEL.vocabulary[term];
    return { idx, val: tf * MODEL.idf[idx] };
  });

  // l2 normalize
  const norm = Math.sqrt(tfidf.reduce((s, e) => s + e.val * e.val, 0)) || 1;
  const vec = tfidf.map(e => ({ idx: e.idx, val: e.val / norm }));

  // decision function per class
  const scores = MODEL.classes.map((cls, c) => {
    let s = MODEL.intercept[c];
    for(const {idx, val} of vec){
      s += val * MODEL.coef[c][idx];
    }
    return s;
  });

  const sorted = [...scores].sort((a,b) => b-a);
  const top = sorted[0];
  const second = sorted.length > 1 ? sorted[1] : 0;
  const margin = top - second;
  const bestIdx = scores.indexOf(top);
  const intent = MODEL.classes[bestIdx];

  if(margin < CONFIDENCE_THRESHOLD){
    return { intent: null, confidence: margin };
  }
  return { intent, confidence: margin };
}

const chatCol = document.getElementById('chatCol');
const chatMain = document.getElementById('chatMain');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const chipsWrap = document.getElementById('chips');

const SUGGESTIONS = [
  "What courses do you offer?",
  "How much are the fees?",
  "Where is the library?",
  "Is there a hostel?"
];

function scrollToBottom(){
  chatMain.scrollTop = chatMain.scrollHeight;
}

function addMessage(text, who, metaHtml){
  const row = document.createElement('div');
  row.className = 'row ' + who;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  if(metaHtml){
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = metaHtml;
    row.appendChild(meta);
  }
  chatCol.appendChild(row);
  scrollToBottom();
  return row;
}

function addTyping(){
  const row = document.createElement('div');
  row.className = 'row bot';
  row.id = 'typingRow';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  row.appendChild(bubble);
  chatCol.appendChild(row);
  scrollToBottom();
}

function removeTyping(){
  const row = document.getElementById('typingRow');
  if(row) row.remove();
}

function renderChips(){
  chipsWrap.innerHTML = '';
  SUGGESTIONS.forEach(s => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = s;
    chip.onclick = () => { userInput.value = s; handleSend(); };
    chipsWrap.appendChild(chip);
  });
}

function handleSend(){
  const text = userInput.value.trim();
  if(!text) return;
  addMessage(text, 'user');
  userInput.value = '';
  userInput.style.height = 'auto';
  sendBtn.disabled = true;
  addTyping();

  setTimeout(() => {
    removeTyping();
    const { intent, confidence } = classify(text);
    const reply = intent ? pickResponse(intent) : FALLBACK_RESPONSE;
    const tagLabel = intent || 'fallback';
    const metaHtml = `<span class="intent-tag">${tagLabel}</span> &middot; confidence ${confidence.toFixed(2)}`;
    addMessage(reply, 'bot', metaHtml);
    sendBtn.disabled = false;
    userInput.focus();
  }, 420 + Math.random()*280);
}

sendBtn.addEventListener('click', handleSend);
userInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    handleSend();
  }
});
userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
});

renderChips();
addMessage(pickResponse('greeting'), 'bot', '<span class="intent-tag">greeting</span>');
</script>
